summary: "Find host's current aggregate"
description: "Scans all aggregates to find which one contains the specified host"
kind: script
language: python3
schema:
  $schema: "https://json-schema.org/draft/2020-12/schema"
  type: object
  properties:
    openstack_connection:
      type: object
      description: "OpenStack credentials"
      format: resource-openstack_connection
    hostname:
      type: string
      description: "Hostname to search for"
  required:
    - openstack_connection
    - hostname
cache_ttl: 600
